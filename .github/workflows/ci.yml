name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 🔑 Secret scanning — full history, so a leaked key can't hide in an old commit.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for GitHub *organization* repos; free for personal repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 📦 Dependency + filesystem scan and SBOM (CycloneDX) artifact.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 0            # report-only; flip to 1 to make findings block
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # Fast, dependency-light gate: the SDK unit tests plus the hash-chain
  # regression test (the product's core trust claim). Neither needs Postgres.
  sdk-and-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SDK + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk
          pip install pytest
      - name: SDK tests
        run: pytest sdk/tests -q
      - name: Hash-chain regression test
        run: pytest backend/tests/test_chain.py -q

  # Full backend integration suite against a real Postgres: auth/RBAC, tenant
  # isolation, HMAC keys + legacy fallback, ingest->chain->verify (incl. tamper),
  # /health/ready, policy->judge wiring, and public-chain anchoring (stub provider).
  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foxy
          POSTGRES_PASSWORD: foxy
          POSTGRES_DB: foxy_pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foxy -d foxy_pytest"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://foxy:foxy@localhost:5432/foxy_pytest
      API_KEY_PEPPER: testpepper
      SESSION_SECRET: test-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx
      - name: Integration tests (conftest runs alembic upgrade head)
        working-directory: backend
        run: pytest tests/integration -q

  # Syntax/compile gate for the PyQt6 desktop app. Uses py_compile so it needs
  # no Qt platform libraries or GUI on the runner.
  desktop-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile desktop modules
        run: |
          python -m py_compile \
            omni_fox.py dashboard.py clay_chat_popup.py fox_settings.py \
            settings_dialog.py sdk_bridge.py ai_providers.py \
            window_tracker.py eye_tracker.py security_overlay.py
