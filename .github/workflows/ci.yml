name: CI

# This repo is PRIVATE, so every minute is billed — and the multipliers are the
# part that bites: Linux 1x, Windows 2x, macOS 10x. A bare `on: push:` with no
# branch filter ran all six jobs on every push to every branch, and because
# `pull_request` was listed as well, opening a PR ran the whole suite twice.
#
# Scoped to main + PRs. Feature branches are gated locally instead, which is
# what actually happens in this project anyway. Docs-only commits skip entirely,
# and a superseded push cancels the run it superseded rather than paying for a
# result nobody will read.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # 🔑 Secret scanning — full history, so a leaked key can't hide in an old commit.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the gitleaks CLI binary directly — the gitleaks-action@v2 now demands a
      # paid GITLEAKS_LICENSE even on this repo and fails before scanning. The CLI is
      # the same engine, free, and needs no license. Full history is present (fetch-depth:0).
      - name: Run Gitleaks (CLI — no license required)
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xzf - gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  # 📦 Dependency + filesystem scan and SBOM (CycloneDX) artifact.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 0            # report-only; flip to 1 to make findings block
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # 🐍 Python dependency vulnerability audit (PyPI Advisory DB) for the backend +
  # SDK actually shipped. Report-only like the Trivy scan above — flip
  # continue-on-error to false to make advisories block the build.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps + pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r backend/requirements.txt ./sdk
      - name: Audit installed environment (backend + SDK + transitive)
        continue-on-error: true
        run: pip-audit --desc

  # Fast, dependency-light gate: the SDK unit tests plus the hash-chain
  # regression test (the product's core trust claim). Neither needs Postgres.
  sdk-and-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SDK + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk
          pip install pytest
      - name: SDK tests
        run: pytest sdk/tests -q
      - name: Hash-chain regression test
        run: pytest backend/tests/test_chain.py -q
      - name: Verifier tests (the second, independent implementation)
        # These never ran in CI. The verifier is a hand-written second copy of the
        # chain recipe and of the commitment recipe, and the two drifting apart IS
        # the classic hash-chain bug — test_matches_backend_recipe and
        # test_writer_and_verifier_agree_at_every_version exist precisely to catch
        # it, and nothing was running them. Same runner, stdlib only, no Postgres.
        run: pytest verifier -q
      - name: Dashboard guards
        # THE WHOLE DIRECTORY, not two files from it. Register #55: this ran
        # test_p1_contrast.py and test_p2_structure.py only, so 9 of the 11 guard
        # files never executed in CI — and the unrun ones are the CROSS-SURFACE
        # guards, the ones that catch a backend change whose UI half has not
        # landed yet. Not hypothetical: E1 (`e34e909`) added two reason codes to
        # billing_state.py without the dashboard copy that test_d4_payment_lock.py
        # requires, and that guard sat red on main for three commits — two of them
        # production deploys — with nothing reporting it. A phase split is exactly
        # the window where the two halves disagree, so the guards that span both
        # are the ones that must always run.
        #
        # Still dependency-light: stdlib + pytest, no browser, no Postgres. One
        # file (test_p4c_policy_ui.py) shells out to `node` to drive the real
        # controller through a DOM stub; ubuntu-latest ships Node, which is why
        # this stays on this runner rather than needing a setup step.
        run: pytest foxy-dashboard -q
      # M3a. Wired in here rather than left unrun. checkout.foxyaudit.tech is the
      # only page in this product that loads third-party script, and these guards
      # assert the CSP scoping, the absence of any API key in what the browser
      # receives, and that the sandbox/live switch cannot be mis-set. A guard
      # suite nothing runs is worse than no guard suite — it reads as coverage.
      - name: Checkout page guards (Paddle)
        run: pytest foxy-checkout -q
      - name: Offline judge demo
        run: python demo/offline_demo.py
      - name: Live OpenAI demo boundary tests
        run: pytest demo/test_live_openai_client.py -q
      - name: Clean-venv install (non-editable) + console script
        # Proves `pip install foxy-audit` works from a fresh environment with no
        # project history — the exact thing an outside user does.
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install --upgrade pip
          /tmp/cleanenv/bin/pip install ./sdk
          /tmp/cleanenv/bin/python -c "import foxy_audit; from foxy_audit import FoxyClient; print('clean import OK')"
          /tmp/cleanenv/bin/foxy --help

  # Full backend integration suite against a real Postgres: auth/RBAC, tenant
  # isolation, HMAC keys + legacy fallback, ingest->chain->verify (incl. tamper),
  # /health/ready, policy->judge wiring, and public-chain anchoring (stub provider).
  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foxy
          POSTGRES_PASSWORD: foxy
          POSTGRES_DB: foxy_pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foxy -d foxy_pytest"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://foxy:foxy@localhost:5432/foxy_pytest
      API_KEY_PEPPER: testpepper
      SESSION_SECRET: test-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx==0.28.1
      - name: Integration tests (conftest runs alembic upgrade head)
        working-directory: backend
        run: pytest tests/integration -q

  # Compile + pure-logic test gate for the PyQt6 desktop app. Byte-compiling
  # needs nothing, but the tests import QtWidgets (Qt signals carry the client's
  # auth/step-up plumbing), and that dlopens the Qt platform libs even under the
  # offscreen backend — hence the apt step below. No display is required.
  desktop-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile desktop modules
        run: python -m compileall -q desktop
      # PyQt6 links against these at import time; a bare ubuntu runner has none
      # of them and `import PyQt6.QtWidgets` dies with ImportError: libEGL.so.1.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install desktop deps
        run: pip install -r desktop/requirements.txt pytest
      - name: Desktop unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest desktop -q
