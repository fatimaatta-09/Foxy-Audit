name: Release

# Version-tagged releases. Push a tag like `v1.1.2` and this ONE workflow builds
# everything that tag stands for: the SDK sdist + wheel (published to PyPI) and
# the three desktop binaries (Windows installer, Linux AppImage, macOS .app),
# then copies the installers to the VM the download buttons point at.
#
# ONE workflow on `tags: ["v*"]`, deliberately. A second desktop workflow on the
# same trigger would run a second three-platform PyInstaller matrix per tag,
# double the artefact volume, and race this one for the release assets.
#
# ONE tag namespace therefore means ONE version: `VERSION` (repo root, read at
# runtime by `foxy_tokens.APP_VERSION`) and `sdk/pyproject.toml` must both equal
# the tag. `check-version` fails the run in seconds when they don't — a binary
# whose Settings card contradicts its own filename, or a wheel labelled 1.1.1
# published under a v1.1.2 tag, is exactly what that check exists to stop.
# **Bump both files in the commit you tag.**
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # attach build artifacts to a GitHub Release
  id-token: write        # allow switching to PyPI Trusted Publishing later

jobs:
  # Gate everything on the version being consistent and readable, BEFORE four
  # runners spend ten minutes each. Every artefact below is named from this
  # job's output, so no later step invents a number of its own.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION is empty — a build would ship 'Version unknown in this build'."
            exit 1
          fi
          SDK="$(awk -F'"' '/^version = /{print $2; exit}' sdk/pyproject.toml)"
          if [ -z "$SDK" ]; then
            echo "::error::could not read a version from sdk/pyproject.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION says $VERSION · sdk/pyproject.toml says $SDK"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag v$TAG does not match VERSION ($VERSION). Update VERSION in the same commit as the tag."
              exit 1
            fi
            if [ "$TAG" != "$SDK" ]; then
              echo "::error::tag v$TAG does not match sdk/pyproject.toml ($SDK). One tag releases both artefacts, so both must carry the tag's number."
              exit 1
            fi
            echo "tag, VERSION and the SDK all agree: $VERSION"
          fi

  # Build the SDK sdist + wheel. Always runs (tag or manual) so a bad build is
  # caught before any publish step.
  build-sdk:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build ./sdk
      - name: Verify hardened SDK modules are packaged
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("sdk/dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {"foxy_audit/spool.py", "foxy_audit/adapters.py"}
          missing = sorted(name for name in required if not any(path.endswith(name) for path in names))
          if missing:
              raise SystemExit(f"release wheel is missing hardened modules: {missing}")
          print(f"verified {wheel.name}: {', '.join(sorted(required))}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/*

  # Publish to PyPI. HUMAN-GATED: only runs on a version tag, and needs
  # PYPI_API_TOKEN set in repo secrets (or switch to Trusted Publishing and drop
  # the `password:` line). The `pypi` environment lets you add required reviewers.
  publish-pypi:
    needs: build-sdk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ── Desktop installers ─────────────────────────────────────────────────────
  # Windows .exe + Linux AppImage now; macOS .app is built but STUBBED (no
  # notarization until an Apple Developer ID is provided). Every build is
  # UNSIGNED unless the matching cert secret is present — unsigned builds warn
  # and must NOT be handed to real clients as-is.
  build-desktop:
    needs: check-version
    strategy:
      fail-fast: false        # one platform's toolchain breaking must not deny
      matrix:                 # the owner the other two binaries
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The committed number, already checked against the tag. Not derived from
      # the ref, so an installer's filename can never disagree with the version
      # the app itself reports out of the same VERSION file.
      VER: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PyQt6 links against these at import time and PyInstaller imports the
      # package to analyse it, so a bare ubuntu runner trips over libEGL.so.1 —
      # the same dependency ci.yml's desktop job needs.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller desktop/omni_fox.spec

      # A build that produced no runnable file must fail here rather than upload
      # an empty artefact the owner discovers three days later.
      - name: Check PyInstaller produced a runnable file
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) BIN=dist/FoxyAudit.exe ;;
            macOS)   BIN=dist/FoxyAudit.app ;;
            *)       BIN=dist/FoxyAudit ;;
          esac
          test -e "$BIN" || { echo "::error::$BIN was not produced"; exit 1; }
          echo "built: $BIN"

      # The assets the app resolves through foxy_tokens.resource_path(). A past
      # spec bug meant fonts/ was never bundled and the shipped build silently
      # fell back to system fonts; onefile hides that until runtime, so read the
      # build-time TOC rather than trusting the spec.
      - name: Verify the bundle carries its assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys
          # PyInstaller onefile appends a CArchive, not a zip — the reliable
          # check is the build-time TOC that Analysis wrote.
          toc = pathlib.Path("build/omni_fox/Analysis-00.toc")
          if not toc.exists():
              candidates = list(pathlib.Path("build").rglob("Analysis-00.toc"))
              toc = candidates[0] if candidates else None
          if toc is None:
              print("::error::no Analysis TOC found — cannot verify the bundle")
              sys.exit(1)
          text = toc.read_text(encoding="utf-8", errors="replace")
          required = ["ultimate_fox_spritesheet.png", "logo.png", "VERSION",
                      "Unbounded-700.ttf", "SpaceMono-400.ttf"]
          missing = [name for name in required if name not in text]
          if missing:
              print(f"::error::these assets are not in the bundle: {missing}")
              sys.exit(1)
          print("bundle carries:", ", ".join(required))
          PY

      # ---- Windows: Inno Setup installer (+ optional signing) ----
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$VER" desktop/installer.iss
          # Inno Setup's OutputDir is relative to the .iss file, so it lands in desktop/Output.
          ls -la desktop/Output
      - name: Sign Windows installer if a cert is provided
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERT_BASE64" ]; then
            echo "::warning::No WINDOWS_CERT_BASE64 secret — the installer is UNSIGNED (SmartScreen will warn). Do not distribute to real clients as-is."
            exit 0
          fi
          echo "$WINDOWS_CERT_BASE64" | base64 -d > cert.pfx
          SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe 2>/dev/null | grep -i x64 | head -1)
          "$SIGNTOOL" sign //f cert.pfx //p "$WINDOWS_CERT_PASSWORD" //tr http://timestamp.digicert.com //td sha256 //fd sha256 "desktop/Output/FoxyAudit-Setup-$VER.exe"
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FoxyAudit-Windows
          path: desktop/Output/*.exe
          if-no-files-found: error

      # ---- Linux: AppImage ----
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          APPDIR=FoxyAudit.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp dist/FoxyAudit "$APPDIR/usr/bin/FoxyAudit"
          cp desktop/logo.png "$APPDIR/foxyaudit.png"
          # desktop/foxy-audit.desktop is the one committed entry (it also ships
          # in the artefact, for installing the raw binary under /opt). Only the
          # two path keys are rewritten here: inside an AppDir, Exec and Icon
          # must be AppDir-relative names, never absolute install paths.
          sed -e 's|^Exec=.*|Exec=FoxyAudit|' -e 's|^Icon=.*|Icon=foxyaudit|' \
            desktop/foxy-audit.desktop > "$APPDIR/foxyaudit.desktop"
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/FoxyAudit" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" "FoxyAudit-$VER-x86_64.AppImage"
          ls -la *.AppImage
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: FoxyAudit-Linux
          path: |
            *.AppImage
            desktop/foxy-audit.desktop
          if-no-files-found: error

      # ---- macOS: STUBBED (build only; unsigned, not notarized) ----
      - name: Package macOS (stubbed)
        if: runner.os == 'macOS'
        run: |
          echo "::warning::macOS build is UNSIGNED and NOT notarized — Gatekeeper will block it. Provide an Apple Developer ID to enable signing/notarization before shipping."
          cd dist && zip -r -q FoxyAudit-macos.zip FoxyAudit.app && ls -la
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FoxyAudit-macOS
          path: dist/FoxyAudit-macos.zip
          if-no-files-found: error

  # ── Publish installers to the VM download dir ──────────────────────────────
  # Copies the Windows + Linux builds to /home/devops/foxy-downloads on the prod
  # VM under STABLE names, so the sales-page download buttons never change per
  # release. Served by host nginx at https://foxyaudit.tech/download/.
  publish-installers-to-vm:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage installers with stable names
        run: |
          mkdir -p out
          cp artifacts/FoxyAudit-Windows/*.exe        "out/FoxyAudit-Setup.exe"       2>/dev/null || echo "no windows artifact"
          cp artifacts/FoxyAudit-Linux/*.AppImage      "out/FoxyAudit-x86_64.AppImage" 2>/dev/null || echo "no linux artifact"
          ls -la out
      - name: Copy to the VM download dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST1 }}
          username: ${{ secrets.VM_USER1 }}
          key: ${{ secrets.VM_SSH_KEY1 }}
          source: "out/*"
          target: "/home/devops/foxy-downloads/"
          strip_components: 1
