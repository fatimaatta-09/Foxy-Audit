name: Desktop release

# Tag pushes ONLY — never on every commit. A PyInstaller matrix across three
# runners takes minutes and produces ~100 MB of artefacts; running it per push
# would swamp the CI queue that the real gate (ci.yml) depends on.
# `workflow_dispatch` is here so the owner can produce a build without cutting
# a tag, which is the case D15 QA will actually need.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # The tag and the committed VERSION must agree BEFORE three runners spend
  # ten minutes each. foxy_tokens reads VERSION at runtime, so a mismatch ships
  # a binary whose Settings card contradicts its own filename.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION is empty — a build would ship 'Version unknown in this build'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION file says: $VERSION"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag v$TAG does not match VERSION ($VERSION). Update VERSION in the same commit as the tag."
              exit 1
            fi
            echo "tag and VERSION agree: $VERSION"
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false          # one platform's toolchain breaking must not
      matrix:                   # deny the owner the other two binaries
        include:
          - os: windows-latest
            artifact: FoxyAudit-windows
            binary: dist/FoxyAudit.exe
          - os: macos-latest
            artifact: FoxyAudit-macos
            binary: dist/FoxyAudit.app
          - os: ubuntu-latest
            artifact: FoxyAudit-linux
            binary: dist/FoxyAudit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # PyQt6 links against these at import time and PyInstaller imports the
      # app to analyse it, so a bare ubuntu runner fails with libEGL.so.1 —
      # the same dependency ci.yml's desktop job needs.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean desktop/omni_fox.spec

      # A build that produced no runnable file must fail here rather than
      # upload an empty artefact the owner discovers three days later.
      - name: Check the binary exists
        shell: bash
        run: |
          set -euo pipefail
          test -e "${{ matrix.binary }}" || { echo "::error::${{ matrix.binary }} was not produced"; exit 1; }
          echo "built: ${{ matrix.binary }}"

      # The assets the app resolves through foxy_tokens.resource_path(). A
      # past spec bug meant fonts/ was never bundled and the shipped build
      # silently fell back to system fonts; onefile hides that until runtime,
      # so unpack the archive and look.
      - name: Verify the bundle carries its assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, zipfile
          # PyInstaller onefile appends a CArchive, not a zip — the reliable
          # check is the build-time TOC that Analysis wrote.
          toc = pathlib.Path("build/omni_fox/Analysis-00.toc")
          if not toc.exists():
              candidates = list(pathlib.Path("build").rglob("Analysis-00.toc"))
              toc = candidates[0] if candidates else None
          if toc is None:
              print("::error::no Analysis TOC found — cannot verify the bundle")
              sys.exit(1)
          text = toc.read_text(encoding="utf-8", errors="replace")
          required = ["ultimate_fox_spritesheet.png", "logo.png", "VERSION",
                      "Unbounded-700.ttf", "SpaceMono-400.ttf"]
          missing = [name for name in required if name not in text]
          if missing:
              print(f"::error::these assets are not in the bundle: {missing}")
              sys.exit(1)
          print("bundle carries:", ", ".join(required))
          PY

      - name: Stage the Linux desktop entry
        if: runner.os == 'Linux'
        run: cp desktop/foxy-audit.desktop dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.check-version.outputs.version }}
          path: |
            dist/FoxyAudit*
            dist/foxy-audit.desktop
          if-no-files-found: error
          retention-days: 30
