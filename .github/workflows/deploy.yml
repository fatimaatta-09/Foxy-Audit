# Continuous Deployment — foxyaudit.tech (VM at 34.18.4.58)
#
# On push to main: scan → build+scan the backend image → SSH to the VM and
# `docker compose up --build -d` the production stack (deploy/docker-compose.prod.yml:
# Postgres + migrate + API + worker + Caddy serving the three sites over TLS).
#
# One-time setup required before this can deploy (see DEPLOYMENT.md):
#   * GitHub repo secrets: VM_HOST1 (34.18.4.58), VM_USER1, VM_SSH_KEY1
#   * DNS A records: foxyaudit.tech, www, app, admin → 34.18.4.58
#   * On the VM: docker + compose plugin installed; deploy/.env created from
#     deploy/.env.example (strong prod secrets — never committed)

name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: foxy-audit-backend

jobs:
  # 🔑 1️⃣ Secret scanning (full history)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 📦 2️⃣ Dependency + IaC scan and SBOM
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # ✅ 3️⃣ Fast test gate (the full Postgres integration suite runs in ci.yml
  # on the same push; this keeps the deploy pipeline quick but never blind).
  quick-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SDK + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk
          pip install pytest
      - name: SDK tests
        run: pytest sdk/tests -q
      - name: Hash-chain regression test
        run: pytest backend/tests/test_chain.py -q

  # 🐳 4️⃣ Build the backend image and scan it. The VM rebuilds from source on
  # deploy (no registry), so this build exists purely to gate on image CVEs.
  image-scan:
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-scan
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          scanners: vuln

  # 🚀 5️⃣ Deploy to the VM
  deploy:
    name: Deploy foxyaudit.tech stack to VM
    runs-on: ubuntu-latest
    needs:
      - quick-tests
      - image-scan
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST1 }}
          username: ${{ secrets.VM_USER1 }}
          key: ${{ secrets.VM_SSH_KEY1 }}
          port: 22
          script: |
            set -e
            TARGET_DIR="/home/${{ secrets.VM_USER1 }}/foxy-audit"

            if [ ! -d "$TARGET_DIR" ]; then
              git clone https://github.com/fatimaatta-09/Foxy-Audit.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            git fetch origin main
            # Remember the currently-deployed commit so a failed smoke test can roll
            # back to it (empty on a first-ever deploy).
            PREV="$(git rev-parse HEAD 2>/dev/null || echo '')"
            git reset --hard origin/main

            if [ ! -f deploy/.env ]; then
              echo "FATAL: deploy/.env missing on the VM — create it from deploy/.env.example" >&2
              exit 1
            fi

            deploy() {
              docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env \
                up --build -d --remove-orphans
            }

            # Smoke test: the backend must answer /health/ready on its loopback
            # publish (127.0.0.1:8085) within ~60s, or the deploy is considered bad.
            smoke() {
              for _ in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:8085/health/ready >/dev/null 2>&1; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            deploy
            if ! smoke; then
              echo "::error:: smoke test FAILED — rolling back to ${PREV:-<none>}" >&2
              docker compose -f deploy/docker-compose.prod.yml logs --tail=60 foxy-backend >&2 || true
              if [ -n "$PREV" ]; then
                git reset --hard "$PREV"
                deploy || true   # best-effort restore of last-good code (DB migrations are forward-only)
              fi
              exit 1
            fi

            echo "smoke test passed — deploy healthy"
            docker image prune -f
