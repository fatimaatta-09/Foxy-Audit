# foxyaudit.tech vhosts for the SHARED VM's host nginx (which owns 80/443).
# The Foxy backend is published loopback-only at 127.0.0.1:8085 by
# deploy/docker-compose.prod.yml. Install:
#   sudo cp deploy/nginx-foxyaudit.conf /etc/nginx/sites-available/foxyaudit.conf
#   sudo ln -s /etc/nginx/sites-available/foxyaudit.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d foxyaudit.tech -d www.foxyaudit.tech \
#        -d app.foxyaudit.tech -d admin.foxyaudit.tech \
#        -d checkout.foxyaudit.tech
# (certbot rewrites these blocks for TLS + adds the 80→443 redirects.)
#
# THIS FILE IS WHAT ACTUALLY SERVES PRODUCTION. deploy/Caddyfile describes the
# same four sites for a dedicated box, but the caddy service sits behind
# `profiles: ["edge"]` and is not started on the shared VM. When a site changes,
# it changes in BOTH files or the two disagree about what is public.
#
# X-Forwarded-For is OVERWRITTEN with $remote_addr (never appended) — the
# backend trusts this header for rate-limit keys, traffic ip_hash, and the
# admin IP allow-list, so a client must not be able to inject its own.

# ── Site 1 · marketing (static) ──────────────────────────────────────────────
server {
    listen 80;
    server_name foxyaudit.tech www.foxyaudit.tech;

    root /home/devops/foxy-audit/foxy-sale-page;
    index index.html;

    # Installer downloads — served from an OUT-OF-GIT dir so the binaries never
    # bloat the repo or get wiped by the deploy's `git reset --hard`. The release
    # workflow scp's builds here. Create it once on the VM:
    #   mkdir -p /home/devops/foxy-downloads
    location /download/ {
        alias /home/devops/foxy-downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Site 2 · customer dashboard (app.) ───────────────────────────────────────
server {
    listen 80;
    server_name app.foxyaudit.tech;

    client_max_body_size 20m;

    location = / {
        return 302 /dashboard;
    }

    # the staff surface is never reachable via the customer hostname
    location /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Site 3 · staff ops console (admin.) ──────────────────────────────────────
server {
    listen 80;
    server_name admin.foxyaudit.tech;

    location = / {
        return 302 /admin/;
    }

    # nothing but the staff surface is served on the admin hostname
    location /admin {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# ── Site 4 · Paddle checkout (checkout.) ─────────────────────────────────────
# Static only, and deliberately NO proxy_pass: the one origin in this product
# that runs third-party payment script has no route to the API at all.
#
# The CSP below is byte-identical to the one in deploy/Caddyfile and a guard in
# foxy-checkout/test_checkout_page.py fails if they ever drift. THIS one is the
# copy that reaches a customer — the Caddy file is the dedicated-box path and is
# not running. `always` matters: without it nginx omits the header on a 404, and
# a 404 is the normal response for config.js on a deployment that has not been
# configured yet.
server {
    listen 80;
    server_name checkout.foxyaudit.tech;

    root /home/devops/foxy-audit/foxy-checkout;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.paddle.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.paddle.com; font-src 'self' data:; frame-src https://*.paddle.com https://paddle.com; connect-src https://*.paddle.com https://paddle.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A payment step, not a landing page. Keeping it out of search stops expired
    # _ptxn links being indexed and followed later.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The ONE deployment value, served from OUT OF GIT. The deploy runs
    # `git reset --hard origin/main`, so a config.js inside the repo working tree
    # would be destroyed on every push — which is why it lives here instead, the
    # same reasoning as /home/devops/foxy-downloads.
    #
    # `alias` to the file rather than `root`, because the served path and the
    # on-disk path share no suffix. Exact-match `= /config.js` wins over the
    # `location /` below, so try_files never sees it.
    #
    # When the file is absent — every deployment nobody has configured yet —
    # nginx answers a clean 404 and the page shows its unconfigured state. It
    # must NOT fall back to index.html: that would hand the browser HTML to
    # parse as JavaScript.
    #
    # No add_header here on purpose: nginx drops inherited headers in any
    # location that declares one of its own, and this response has to keep the
    # server-level CSP.
    location = /config.js {
        alias /home/devops/foxy-checkout-config/config.js;
    }

    location / {
        # =404, NOT a fallback to /index.html the way the marketing vhost does.
        # A missing asset here is a missing asset, not a reason to serve the
        # page again. Caddy's file_server answers 404 too, so the two edges
        # behave alike.
        try_files $uri $uri/ =404;
    }
}
