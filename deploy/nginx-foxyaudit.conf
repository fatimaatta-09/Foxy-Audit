# foxyaudit.tech vhosts for the SHARED VM's host nginx (which owns 80/443).
# The Foxy backend is published loopback-only at 127.0.0.1:8085 by
# deploy/docker-compose.prod.yml. Install:
#   sudo cp deploy/nginx-foxyaudit.conf /etc/nginx/sites-available/foxyaudit.conf
#   sudo ln -s /etc/nginx/sites-available/foxyaudit.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d foxyaudit.tech -d www.foxyaudit.tech \
#        -d app.foxyaudit.tech -d admin.foxyaudit.tech
# (certbot rewrites these blocks for TLS + adds the 80→443 redirects.)
#
# X-Forwarded-For is OVERWRITTEN with $remote_addr (never appended) — the
# backend trusts this header for rate-limit keys, traffic ip_hash, and the
# admin IP allow-list, so a client must not be able to inject its own.

# ── Site 1 · marketing (static) ──────────────────────────────────────────────
server {
    listen 80;
    server_name foxyaudit.tech www.foxyaudit.tech;

    root /home/devops/foxy-audit/foxy-sale-page;
    index index.html;

    # Installer downloads — served from an OUT-OF-GIT dir so the binaries never
    # bloat the repo or get wiped by the deploy's `git reset --hard`. The release
    # workflow scp's builds here. Create it once on the VM:
    #   mkdir -p /home/devops/foxy-downloads
    location /download/ {
        alias /home/devops/foxy-downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Site 2 · customer dashboard (app.) ───────────────────────────────────────
server {
    listen 80;
    server_name app.foxyaudit.tech;

    client_max_body_size 20m;

    location = / {
        return 302 /dashboard;
    }

    # the staff surface is never reachable via the customer hostname
    location /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Site 3 · staff ops console (admin.) ──────────────────────────────────────
server {
    listen 80;
    server_name admin.foxyaudit.tech;

    location = / {
        return 302 /admin/;
    }

    # nothing but the staff surface is served on the admin hostname
    location /admin {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
