services:
  db:
    image: postgres:16
    container_name: foxy_pg
    environment:
      POSTGRES_USER: foxy
      POSTGRES_PASSWORD: foxy
      POSTGRES_DB: foxy
    ports:
      - "5432:5432"
    volumes:
      - foxy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxy -d foxy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Run migrations to head, then exit. Everything below waits for this to succeed
  # (nothing else migrated the schema before).
  foxy-migrate:
    build: .
    container_name: foxy_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://foxy:foxy@db:5432/foxy
    command: alembic upgrade head

  # One-shot: create a demo org + admin user (the API key is printed in its logs).
  foxy-seed:
    build: .
    container_name: foxy_seed
    depends_on:
      foxy-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://foxy:foxy@db:5432/foxy
    command: >
      python scripts/seed_org.py --name "Demo Corp"
      --admin-email admin@demo.test --admin-password adminpass123

  foxy-backend:
    build: .
    container_name: foxy_backend
    depends_on:
      db:
        condition: service_healthy
      foxy-migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://foxy:foxy@db:5432/foxy
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Both judges are optional. Pass the OpenAI settings through so the local
      # compose stack exercises the same content-blind judge configuration as prod.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-12}
      - SESSION_SECRET=${SESSION_SECRET:-foxy_demo_session_secret}
      - API_KEY_PEPPER=${API_KEY_PEPPER:-foxy_demo_pepper}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Admin site ("site 3") — staff cookie secret MUST differ from SESSION_SECRET in prod.
      - STAFF_SESSION_SECRET=${STAFF_SESSION_SECRET:-foxy_demo_staff_session_secret}
      - STAFF_COOKIE_DOMAIN=${STAFF_COOKIE_DOMAIN:-}
      - ADMIN_CORS_ORIGINS=${ADMIN_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      - ADMIN_IP_ALLOWLIST=${ADMIN_IP_ALLOWLIST:-}
      # In/out traffic capture (IP/UA HMAC-hashed with the pepper, never raw).
      - TRAFFIC_TRACKING_ENABLED=${TRAFFIC_TRACKING_ENABLED:-true}
      - TRAFFIC_RETENTION_DAYS=${TRAFFIC_RETENTION_DAYS:-90}
    volumes:
      # The dashboard + ops-console HTML live at the repo root (outside this
      # build context) in foxy-dashboard/ and foxy-adminpage/.
      - ../foxy-dashboard/foxy-audit-premium.html:/app/foxy-audit-premium.html:ro
      - ../foxy-adminpage/index.html:/app/foxy-adminpage.html:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Durable grading poller — drains the audit_logs Postgres outbox (app/worker.py).
  # No Redis: the queue lives in Postgres, so this is stateless and restart-safe.
  foxy-worker:
    build: .
    container_name: foxy_worker
    depends_on:
      db:
        condition: service_healthy
      foxy-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://foxy:foxy@db:5432/foxy
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-12}
      # usage_daily rollups + traffic partition create/drop run in this worker.
      - USAGE_ROLLUP_INTERVAL=${USAGE_ROLLUP_INTERVAL:-300}
      - TRAFFIC_RETENTION_DAYS=${TRAFFIC_RETENTION_DAYS:-90}
    command: python -m app.worker_main
    # Healthy only if the poller wrote a heartbeat in the last 30s (detects a hang).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,psycopg,datetime as d,sys; u=os.environ['DATABASE_URL'].replace('+psycopg',''); c=psycopg.connect(u); r=c.execute('SELECT beat_at FROM worker_heartbeat WHERE id=1').fetchone(); c.close(); sys.exit(0 if r and r[0] and (d.datetime.now(d.timezone.utc)-r[0]).total_seconds()<30 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

volumes:
  foxy_pgdata:
