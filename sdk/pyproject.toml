[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foxy-audit"
version = "0.1.0"
description = "Governance-as-Code SDK for AI compliance: local SHA-256 hashing + tamper-evident audit telemetry, with zero raw-text exfiltration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Foxy Audit" }]
keywords = ["compliance", "audit", "ai", "governance", "hipaa", "soc2", "eu-ai-act"]
# A library: bound the major (never exact-pin) so it stays co-installable in a
# consumer's environment. (Phase 5 · 5F)
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]
# Deep NLP PII detection (names / locations / MRNs). Also needs a spaCy model:
#   python -m spacy download en_core_web_lg
pii = ["presidio-analyzer>=2.2", "spacy>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/foxy_audit"]
